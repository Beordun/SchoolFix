<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #f8f7fa;
      font-family: 'Bricolage Grotesque', sans-serif;
    }
    .spec-label {
      font-size: 14px;
      color: #79757f;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      font-family: sans-serif;
    }
    .display-text {
      font-size: 64px;
      font-weight: 600;
      line-height: 89.6px;
      color: #4b0082;
      max-width: 800px;
    }
    .default-spacing {
      letter-spacing: 0px; /* Default unadjusted letter spacing */
    }
    .chosen-spacing {
      letter-spacing: -2.24px; /* Chosen calibrated compact tracking (-3.5%) */
    }
  </style>
</head>
<body>
  <div class="spec-label" id="label">Bricolage Grotesque Display Large (64px) — Tracking: -2.24px (-3.5% Chosen Compact)</div>
  <div class="display-text chosen-spacing" id="target">
    Second Term School Fee & Exam Clearance Register
  </div>
</body>
</html>
